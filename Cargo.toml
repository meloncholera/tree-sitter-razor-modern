[package]
name = "tree-sitter-razor-modern"
description = "Tree-sitter grammar for ASP.NET Core Razor markup (.cshtml and .razor)"
version = "0.1.0"
authors = ["tris203", "M. Reifschneider"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "razor"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/meloncholera/tree-sitter-razor-modern.git"
edition = "2024"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["/LICENSE", "/NOTICE", "/README.md", "/tree-sitter.json", "/bindings/rust/*", "/grammar.js", "/queries/*", "/src/**"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "~1.4.4"

[dev-dependencies]
tree-sitter = "~0.27.0"
